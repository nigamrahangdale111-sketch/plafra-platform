
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAFRA — Your Creative Service Partner</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #1e293b; border-bottom: 1px solid #334155; padding: 1.25rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.5rem; font-weight: 800; color: #38bdf8; letter-spacing: -0.5px; }
    .tagline { font-size: 0.875rem; color: #94a3b8; }
    main { flex: 1; max-width: 480px; margin: 3rem auto; padding: 1rem; width: 100%; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); }
    h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: #f8fafc; text-align: center; }
    p.sub { font-size: 0.875rem; color: #94a3b8; margin-bottom: 1.5rem; text-align: center; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; color: #cbd5e1; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #475569; border-radius: 6px; font-size: 1rem; background: #0f172a; color: #fff; }
    input:focus { outline: none; border-color: #38bdf8; }
    .btn { width: 100%; background: #2563eb; color: #ffffff; font-weight: 600; padding: 0.75rem; border-radius: 6px; border: none; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
    .btn:disabled { background: #64748b; cursor: not-allowed; }
    .btn-secondary { background: #334155; color: #f8fafc; margin-top: 1rem; }
    .toggle-text { font-size: 0.875rem; text-align: center; margin-top: 1.25rem; color: #94a3b8; }
    .toggle-text span { color: #38bdf8; font-weight: 600; cursor: pointer; text-decoration: underline; }
    #status-msg { margin-top: 1rem; font-size: 0.875rem; padding: 0.75rem; border-radius: 6px; display: none; text-align: center; }
    .success { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; display: block !important; }
    .error { background: #7f1d1d; color: #fca5a5; border: 1px solid #dc2626; display: block !important; }
    #dashboard-view { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">PLAFRA</div>
    <div class="tagline">Your Creative Service Partner</div>
  </header>

  <main>
    <div class="card" id="auth-view">
      <h2 id="auth-title">Create an Account</h2>
      <p class="sub" id="auth-sub">Access your creative portal and service requests</p>

      <form id="auth-form" onsubmit="event.preventDefault(); handleAuthSubmit();">
        <div class="form-group" id="name-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" placeholder="Your Name" />
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="name@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" />
        </div>
        <button type="submit" class="btn" id="submit-btn">Sign Up</button>
      </form>

      <div class="toggle-text">
        <span id="toggle-auth" onclick="toggleAuthMode()">Already have an account? Sign In</span>
      </div>

      <div id="status-msg"></div>
    </div>

    <div class="card" id="dashboard-view">
      <h2>Client Portal</h2>
      <p class="sub" id="user-display">Logged in</p>
      <div style="background: #0f172a; border: 1px dashed #475569; border-radius: 8px; padding: 1.5rem; text-align: center; margin-bottom: 1rem;">
        <p style="font-weight: 600; color: #f8fafc;">No active requests yet</p>
        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.35rem;">Your creative drafts and project deliverables will appear here.</p>
      </div>
      <button class="btn btn-secondary" onclick="signOut()">Sign Out</button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://tphghcbttgibegrnqijx.supabase.co";
    const SUPABASE_KEY = "sb_publishable_8YOgpGeB_dieXVq3x4gGKQ_kiwVcxIt";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let isSignUp = true;

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById('auth-title').innerText = isSignUp ? "Create an Account" : "Welcome Back";
      document.getElementById('auth-sub').innerText = isSignUp ? "Access your creative portal and service requests" : "Log in to track your deliverables";
      document.getElementById('name-group').style.display = isSignUp ? "block" : "none";
      document.getElementById('submit-btn').innerText = isSignUp ? "Sign Up" : "Sign In";
      document.getElementById('toggle-auth').innerText = isSignUp ? "Already have an account? Sign In" : "Don't have an account? Sign Up";
      clearMessage();
    }

    function showMessage(text, isError) {
      const msg = document.getElementById('status-msg');
      msg.innerText = text;
      msg.className = isError ? 'error' : 'success';
      msg.style.display = 'block';
    }

    function clearMessage() {
      const msg = document.getElementById('status-msg');
      msg.innerText = '';
      msg.className = '';
      msg.style.display = 'none';
    }

    async function checkUser() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session && session.user) {
          showDashboard(session.user);
        }
      } catch (err) {
        console.error("Session check error:", err);
      }
    }

    function showDashboard(user) {
      document.getElementById('auth-view').style.display = 'none';
      document.getElementById('dashboard-view').style.display = 'block';
      document.getElementById('user-display').innerText = `Logged in as: ${user.email}`;
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      document.getElementById('dashboard-view').style.display = 'none';
      document.getElementById('auth-view').style.display = 'block';
      clearMessage();
    }

    async function handleAuthSubmit() {
      clearMessage();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const fullName = document.getElementById('fullName').value.trim();
      const btn = document.getElementById('submit-btn');

      if (!email || !password) {
        showMessage("Please enter both email and password.", true);
        return;
      }

      if (password.length < 6) {
        showMessage("Password must be at least 6 characters.", true);
        return;
      }

      btn.disabled = true;
      btn.innerText = "Processing...";

      try {
        if (isSignUp) {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: { full_name: fullName }
            }
          });

          if (error) {
            showMessage(error.message, true);
          } else if (data?.user) {
            if (data.session) {
              showDashboard(data.user);
            } else {
              showMessage("Sign-up registered! You can now switch to Sign In.", false);
            }
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });

          if (error) {
            showMessage(error.message, true);
          } else if (data?.user) {
            showDashboard(data.user);
          }
        }
      } catch (err) {
        showMessage("Network error: " + err.message, true);
      } finally {
        btn.disabled = false;
        btn.innerText = isSignUp ? "Sign Up" : "Sign In";
      }
    }

    checkUser();
  </script>
</body>
</html>
