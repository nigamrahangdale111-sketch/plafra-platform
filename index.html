
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLAFRA — Your Creative Service Partner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; display: flex; flex-direction: column; min-height: 100vh; }
    header { background: #ffffff; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.5rem; font-weight: 800; color: #1d4ed8; letter-spacing: -0.5px; }
    .tagline { font-size: 0.875rem; color: #64748b; }
    main { flex: 1; max-width: 800px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
    h1 { font-size: 2.25rem; font-weight: 800; color: #0f172a; margin-bottom: 1rem; line-height: 1.2; }
    p.lead { font-size: 1.125rem; color: #475569; margin-bottom: 2rem; }
    .card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .btn { display: inline-block; background: #2563eb; color: #ffffff; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none; margin-top: 1rem; }
  </style>
</head>
<body>
  <header>
    <div class="brand">PLAFRA</div>
    <div class="tagline">Your Creative Service Partner</div>
  </header>
  <main>
    <h1>Structured Creative Services</h1>
    <p class="lead">Promotional creative materials, templates, and banners delivered through one organized workflow.</p>
    <div class="card">
      <h2>Platform Launching Soon</h2>
      <p style="margin-top: 0.5rem; color: #64748b;">We are currently setting up client portal onboarding.</p>
      <a href="mailto:contact@plafra.com" class="btn">Get in Touch</a>
    </div>
  </main>
</body>
</html>
